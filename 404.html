<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page en Construction - Collège André Derain</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Gris très clair */
            color: #334155; /* Gris foncé */
            overflow-x: hidden; /* Empêche le défilement horizontal */
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .section-padding {
            padding: 4rem 1.5rem;
        }
        @media (min-width: 640px) {
            .section-padding {
                padding: 6rem 2rem;
            }
        }

        /* Custom Animations (from main site) */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fade-in {
            animation: fadeIn 1s ease-out forwards;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .animate-pulse-effect {
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes bounce-in {
            0% { opacity: 0; transform: scale(0.3); }
            50% { opacity: 1; transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
        .animate-bounce-in-effect {
            animation: bounce-in 0.8s ease-out forwards;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center text-center">

    <main class="flex-grow flex flex-col items-center justify-center p-4">
        <div class="max-w-2xl mx-auto">
            <h1 class="text-5xl md:text-7xl font-extrabold text-purple-700 mb-6 animate-pulse-effect">
                Page en Construction
            </h1>
            <p class="text-xl md:text-2xl text-gray-700 mb-8 animate-fade-in delay-200">
                Nous travaillons actuellement sur cette page pour vous apporter du contenu passionnant !
                Revenez bientôt pour découvrir les nouveautés.
            </p>
            <a href="index.html" class="inline-block bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition duration-300 transform hover:scale-105 animate-bounce-in-effect delay-400">
                Retour à l'accueil
            </a>
        </div>
    </main>

    <!-- Pied de page (Footer) - Repris du site principal -->
    <footer class="bg-gray-800 text-gray-400 py-8 px-4 text-center border-t border-gray-700 w-full">
        <p>&copy; 2025 Collège André Derain - Club Théâtre. Tous droits réservés.</p>
        <p class="text-sm mt-2">
            Conçu avec passion pour la scène à Chambourcy.
        </p>
    </footer>

</body>
</html>
